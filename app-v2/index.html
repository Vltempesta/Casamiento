<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Vani &amp; Fede · 24/10/2026</title>
  <meta name="description" content="Ingresá a la web del casamiento de Vani & Fede." />
  <meta property="og:title" content="Vani & Fede · 24/10/2026" />
  <meta property="og:description" content="Todo lo que necesitás para el gran día… y algunas sorpresas." />
  <meta property="og:image" content="preview-whatsapp.jpg" />
  <meta property="og:type" content="website" />
  <meta name="theme-color" content="#f5eddc" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=32302" />
</head>
<body>
  <div class="scene" aria-hidden="true">
    <div class="moon"></div>
    <div class="mist mist-a"></div>
    <div class="mist mist-b"></div>
    <div class="stars"></div>
    <div class="forest-line"></div>
  </div>

  <main id="app" class="app-shell">
    <section id="loginScreen" class="login-screen">
      <div class="login-frame">
        <header class="login-brand">
          <img class="seal-image" src="assets/branding/vyf-seal.png?v=32302" alt="Sello de Vani y Fede" width="105" height="113" />

          <h1 class="couple-wordmark">
            <span>Vani</span>
            <b aria-hidden="true">&amp;</b>
            <span>Fede</span>
          </h1>

          <p class="login-date" aria-label="24 de octubre de 2026">24 - 10 - 2026</p>

          <p class="subtitle">
            <span class="subtitle-emoji" aria-hidden="true">✨</span>
            Buscá tu nombre e ingresá. Adentro te espera todo lo que necesitás para el gran día… y algunas sorpresas.
          </p>
        </header>

        <form id="loginForm" class="login-card" autocomplete="off" novalidate>
          <p class="login-helper">Escribí tu nombre, apellido o alias.</p>

          <label class="sr-only" for="guestName">Nombre, apellido o alias</label>
          <div class="input-row">
            <div class="guest-search">
              <span class="search-icon" aria-hidden="true">⌕</span>
              <input
                id="guestName"
                name="guestName"
                type="text"
                placeholder="Buscá tu nombre…"
                autocomplete="off"
                autocapitalize="words"
                spellcheck="false"
                aria-autocomplete="list"
                aria-controls="guestSuggestionPanel"
                aria-expanded="false"
                required
              />
              <div id="guestSuggestionPanel" class="guest-suggestions hidden" role="listbox" aria-label="Invitados encontrados"></div>
            </div>
            <button id="loginButton" type="submit"><span>Ingresar</span></button>
          </div>

          <div id="loginMessage" class="form-message" role="status" aria-live="polite"></div>
          <span id="connectionBadge" class="status-pill idle">Sheets sin configurar</span>
        </form>
      </div>
    </section>

    <section id="mainScreen" class="main-screen hidden">
      <header class="topbar">
        <div class="topbar-main">
          <p class="eyebrow">Vani &amp; Fede · 24/10/2026</p>
          <h2 id="welcomeTitle">Hola</h2>
          <p id="welcomeSub" class="topbar-sub">Archivo personal activado.</p>
        </div>
        <div class="topbar-actions">
          <span id="syncBadge" class="status-pill idle">Modo local</span>
          <button id="syncButton" class="ghost-button" type="button">Sincronizar</button>
          <button id="shareButton" class="ghost-button" type="button">Compartir</button>
          <button id="logoutButton" class="ghost-button" type="button">Salir</button>
        </div>
      </header>

      <nav class="nav-tabs" aria-label="Secciones principales">
        <button data-route="inicio" class="active">Inicio</button>
        <button data-route="info">Info terrenal</button>
        <button data-route="asistencia">Asistencia</button>
        <button data-route="ficha">Ficha secreta</button>
        <button data-route="equipo">Mi equipo</button>
        <button data-route="torneo">Torneo</button>
        <button data-route="juegos">Juegos</button>
        <button data-route="ranking">Ranking</button>
        <button data-route="invitados">Invitados</button>
        <button data-route="admin">Admin</button>
      </nav>

      <section id="view" class="view" aria-live="polite"></section>
    </section>
  </main>

  <div id="toastHost" class="toast-host" aria-live="polite"></div>

  <script src="config.js?v=32302"></script>
  <script src="data.js?v=32302"></script>
  <script src="app.js?v=32302"></script>
</body>
</html>
